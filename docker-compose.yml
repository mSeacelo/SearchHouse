services:
  db:
    image: postgres:16-alpine
    container_name: searchhouse-db
    environment:
      POSTGRES_DB: searchhouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d searchhouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: searchhouse:1.0
    container_name: searchhouse-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/searchhouse
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    container_name: searchhouse-web
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data: