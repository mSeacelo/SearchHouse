<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/kalango.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SearchHouse: calouros e repúblicas de João Monlevade se encontrando." />
    <meta name="theme-color" content="#237a70" />
    <title>SearchHouse</title>
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar branco no modo escuro.
      (function () {
        try {
          var salvo = localStorage.getItem("searchhouse-tema");
          var escuro = salvo ? salvo === "escuro" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
